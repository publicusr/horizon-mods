id = "coords_hud"
kind = "mod"
name = "Coordinates HUD"
summary = "Your coordinates and facing in a corner of the screen."
description = """
Your block position and the direction you face in the top-left corner of the screen.

- `/where` puts your coordinates and dimension in chat.
- `/coords` hides or shows the box, and the game keeps your choice.
- Settings: Options > Mods > Coordinates HUD > Config (shown).

It reads the player's position, draws on the HUD and writes to chat: nothing else.

Now a WebAssembly mod (3.0.0): install it on the launcher's Mods page, with nothing to build. Your choice carries over
from earlier versions. Its source is
[horizon-mods/native/coords-hud](https://github.com/horizon-rust/horizon-mods/tree/main/native/coords-hud).
"""
authors = ["Horizon"]
owners = ["horizon-rust"]
owner_ids = [349008135]
license = "MIT"
source = "https://github.com/horizon-rust/horizon-mods/tree/main/native/coords-hud"
icon = "icons/coords_hud.png"
categories = ["utility"]
tags = ["coordinates", "hud", "position"]

